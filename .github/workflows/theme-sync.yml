name: Theme Sync

# LS증권 테마 분류·종목 매핑 동기화 (주 1회 권장)
# LS API는 Hostinger IP 차단 → GitHub Actions VM에서 수집 후 SSH pipe로 DB 저장.
# t1532를 종목당 1.1초 간격(+HTTP 왕복)으로 호출 → 전체 ~2,600종목에 약 2시간 소요.

on:
  workflow_dispatch:
  schedule:
    # 매주 토요일 KST 06:00 (UTC 금요일 21:00)
    - cron: '0 21 * * 5'

concurrency:
  group: theme-sync
  cancel-in-progress: false

jobs:
  theme-sync:
    name: 'LS 테마 동기화 (전체 종목 ~2시간)'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout dart-financial-collector
        uses: actions/checkout@v4
        with:
          repository: jude0610/dart-financial-collector
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev
        working-directory: server

      - name: SSH 키 설정
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 종목 코드 조회
        env:
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          # 접속 실패(exit 255)만 재시도한다 — 2026-08-15 이 잡도 `Connection timed out`
          # 한 방에 통째로 실패했다. 재시도 없이 단발로 쏘면 하루치가 그대로 날아간다.
          for attempt in 1 2 3 4 5; do
            if ssh -p 65002 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$SSH_USER@$SSH_HOST" 'bash ~/domains/*/qn-current/server/scripts/qn-task.sh get-stock-codes' > /tmp/codes.json; then
              exit 0
            fi
            rc=$?
            if [ "$rc" -ne 255 ]; then
              echo "❌ 원격 작업 실패 (exit $rc) — 재시도하지 않습니다" >&2
              exit "$rc"
            fi
            [ "$attempt" -eq 5 ] && break
            echo "⚠️  SSH 접속 실패 (시도 $attempt/5) — $((attempt * 30))초 뒤 재시도" >&2
            sleep $((attempt * 30))
          done
          echo "❌ SSH 접속 5회 연속 실패" >&2
          exit 1

      - name: LS증권 테마 수집
        env:
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}
        run: node collect-and-push-themes.js /tmp/codes.json > /tmp/themes.json
        working-directory: server

      - name: DB 저장
        env:
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          # 접속 실패(exit 255)만 재시도한다 — 2026-08-15 이 잡도 `Connection timed out`
          # 한 방에 통째로 실패했다. 재시도 없이 단발로 쏘면 하루치가 그대로 날아간다.
          for attempt in 1 2 3 4 5; do
            if ssh -p 65002 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$SSH_USER@$SSH_HOST" 'bash ~/domains/*/qn-current/server/scripts/qn-task.sh import-themes' < /tmp/themes.json; then
              exit 0
            fi
            rc=$?
            if [ "$rc" -ne 255 ]; then
              echo "❌ 원격 작업 실패 (exit $rc) — 재시도하지 않습니다" >&2
              exit "$rc"
            fi
            [ "$attempt" -eq 5 ] && break
            echo "⚠️  SSH 접속 실패 (시도 $attempt/5) — $((attempt * 30))초 뒤 재시도" >&2
            sleep $((attempt * 30))
          done
          echo "❌ SSH 접속 5회 연속 실패" >&2
          exit 1
