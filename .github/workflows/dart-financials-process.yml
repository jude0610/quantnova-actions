name: 재무지표 가공

on:
  schedule:
    - cron: '0 19 * * 1-5'
  workflow_dispatch:

jobs:
  dart-financials-process:
    name: '재무지표 가공 (KST 04:00 화~토, 증분)'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Run task
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan이 순간적으로 실패하면(네트워크 hiccup 등) known_hosts를 못 채워서
          # GitHub Actions 기본 셸(-e)이 여기서 조용히(출력 없이) 죽는다 — 짧게 재시도해서 흡수한다.
          for i in 1 2 3; do
            ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "⚠️  ssh-keyscan 실패 (시도 $i/3)" >&2
            sleep 3
          done
          # ─ 왜 SSH 세션에 매달지 않는가 (2026-08-20) ────────────────────────
          # 이 잡은 이틀 연속 **정확히 1시간 지점**에서 죽었다:
          #   failed in 1h 1m 4s / 88.2% (2,300/2,608) 진행 중
          #   Connection to *** closed by remote host. → exit 255
          # 유휴 끊김이 아니다 — 죽기 직전까지 몇 초 간격으로 진행률이 찍혔고
          # ServerAliveInterval도 걸려 있었다. 호스팅 측 SSH 세션 상한(1시간)이라
          # keepalive로는 막을 수 없다.
          #
          # 그래서 원격 작업을 setsid로 분리 실행(--start)하고 연결을 즉시 놓은 뒤,
          # 짧은 연결(--poll)을 반복하며 로그만 이어 받는다. 중간에 몇 번 끊기든
          # 서버에서 도는 작업은 영향을 받지 않는다.
          LAUNCHER='bash ~/domains/*/qn-current/server/scripts/qn-task.sh'
          SSH_OPTS="-p 65002 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"

          # 접속 실패만 재시도한다(ssh 자체 실패 = exit 255).
          qn_ssh() {
            local desc="$1"; shift
            local attempt rc
            for attempt in 1 2 3 4 5; do
              set +e
              ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "$@" > /tmp/qn_out 2> /tmp/qn_err
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && return 0
              cat /tmp/qn_err >&2
              if [ "$rc" -ne 255 ]; then
                echo "❌ $desc 실패 (exit $rc)" >&2
                return "$rc"
              fi
              [ "$attempt" -eq 5 ] && break
              echo "⚠️  $desc 접속 실패 (시도 $attempt/5) — $((attempt * 30))초 뒤 재시도" >&2
              sleep $((attempt * 30))
            done
            echo "❌ $desc 접속 5회 연속 실패" >&2
            return 255
          }

          qn_ssh "작업 시작" "$LAUNCHER --start dart-financials-process"
          RUN_ID="$(head -n1 /tmp/qn_out | tr -d '[:space:]')"
          [ -n "$RUN_ID" ] || { echo "❌ run id를 받지 못했습니다" >&2; exit 1; }
          echo "▶ 원격 실행 시작 (run: $RUN_ID) — SSH 세션과 분리되어 돌아갑니다"

          OFFSET=0
          while true; do
            qn_ssh "진행 조회" "$LAUNCHER --poll '$RUN_ID' $OFFSET"
            cat /tmp/qn_out
            STATE_LINE="$(grep '^QN_STATE ' /tmp/qn_err | tail -n1)"
            if [ -z "$STATE_LINE" ]; then
              echo "❌ 상태 줄(QN_STATE)을 받지 못했습니다" >&2
              cat /tmp/qn_err >&2
              exit 1
            fi
            # QN_STATE <다음offset> <running|done|missing> <exit코드>
            set -- $STATE_LINE
            OFFSET="$2"; STATE="$3"; CODE="$4"
            case "$STATE" in
              done)
                if [ "$CODE" = "0" ]; then
                  echo "✅ 원격 작업 완료"
                else
                  echo "❌ 원격 작업 실패 (exit=$CODE)" >&2
                fi
                exit "$CODE"
                ;;
              missing)
                echo "❌ 실행 로그를 찾을 수 없습니다 ($RUN_ID) — 서버에서 프로세스가 뜨지 못했을 수 있습니다" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
