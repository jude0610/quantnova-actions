name: DART 사업보고서(사업개요) 수집

# 사업개요(company_business_overview)는 기업 상세 페이지의 프리렌더 본문과
# AI 한줄평의 원천 데이터인데, 지금까지 스케줄이 없어 수동 실행에만 의존했다.
# 그래서 신규 상장·새 사업보고서가 자동으로 들어오지 않았다.
#
# 주기를 주 1회로 잡은 이유: 사업보고서는 12월 결산 기준 3월 말에 몰려 제출되는
# 연 1회 데이터다. --resume(증분)이라 평소엔 신규 상장분 몇 건만 처리하고 끝난다.
#
# ⚠️ --resume 판정 기준은 사업개요 보유 여부다(load-raw-dart-business-docs.js 참조).
#    사업보고서가 없거나 개요 파싱이 안 되는 종목은 매 실행 재시도되지만,
#    현재 그 규모가 ~95종목이라 주 1회 기준으로 무시할 수준이다.

on:
  schedule:
    # 매주 일요일 KST 03:00 = 토요일 UTC 18:00
    # (일일 잡들이 도는 화~토 새벽 시간대를 피해 주말에 배치)
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      start_year:
        description: '시작 사업연도 (비우면 올해)'
        required: false
        type: string
      end_year:
        description: '종료 사업연도 (비우면 올해)'
        required: false
        type: string
      resume:
        description: '증분 수집(이미 사업개요가 있는 종목 건너뜀)'
        required: false
        type: boolean
        default: true

jobs:
  dart-business-docs:
    name: '사업개요 수집 (KST 일 03:00, 증분)'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run task
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          # 스케줄 실행(inputs 없음)은 항상 증분
          RESUME: ${{ github.event_name == 'schedule' && 'true' || inputs.resume }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan이 순간적으로 실패하면(네트워크 hiccup 등) known_hosts를 못 채워서
          # GitHub Actions 기본 셸(-e)이 여기서 조용히(출력 없이) 죽는다 — 짧게 재시도해서 흡수한다.
          for i in 1 2 3; do
            ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "⚠️  ssh-keyscan 실패 (시도 $i/3)" >&2
            sleep 3
          done

          # ⚠️ `[ 조건 ] && ARGS=...` 형태로 쓰면 안 된다. 조건이 거짓일 때 AND 리스트
          #    전체가 실패로 판정되고, Actions 기본 셸(-e)이 거기서 조용히 죽는다
          #    (resume=false 로 수동 실행하면 아무 것도 안 하고 성공처럼 끝났다).
          ARGS=""
          if [ -n "$START_YEAR" ]; then ARGS="$ARGS --start-year=$START_YEAR"; fi
          if [ -n "$END_YEAR" ];   then ARGS="$ARGS --end-year=$END_YEAR"; fi
          if [ "$RESUME" = "true" ]; then ARGS="$ARGS --resume"; fi

          # ─ 왜 SSH 세션에 매달지 않는가 (2026-08-20) ────────────────────────
          # 이 잡은 이틀 연속 **정확히 1시간 지점**에서 죽었다:
          #   failed in 1h 1m 4s / 88.2% (2,300/2,608) 진행 중
          #   Connection to *** closed by remote host. → exit 255
          # 유휴 끊김이 아니다 — 죽기 직전까지 몇 초 간격으로 진행률이 찍혔고
          # ServerAliveInterval도 걸려 있었다. 호스팅 측 SSH 세션 상한(1시간)이라
          # keepalive로는 막을 수 없다.
          #
          # 그래서 원격 작업을 setsid로 분리 실행(--start)하고 연결을 즉시 놓은 뒤,
          # 짧은 연결(--poll)을 반복하며 로그만 이어 받는다. 중간에 몇 번 끊기든
          # 서버에서 도는 작업은 영향을 받지 않는다.
          LAUNCHER='bash ~/domains/*/qn-current/server/scripts/qn-task.sh'
          SSH_OPTS="-p 65002 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"

          # 접속 실패만 재시도한다(ssh 자체 실패 = exit 255).
          qn_ssh() {
            local desc="$1"; shift
            local attempt rc
            for attempt in 1 2 3 4 5; do
              set +e
              ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "$@" > /tmp/qn_out 2> /tmp/qn_err
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && return 0
              cat /tmp/qn_err >&2
              if [ "$rc" -ne 255 ]; then
                echo "❌ $desc 실패 (exit $rc)" >&2
                return "$rc"
              fi
              [ "$attempt" -eq 5 ] && break
              echo "⚠️  $desc 접속 실패 (시도 $attempt/5) — $((attempt * 30))초 뒤 재시도" >&2
              sleep $((attempt * 30))
            done
            echo "❌ $desc 접속 5회 연속 실패" >&2
            return 255
          }

          qn_ssh "작업 시작" "$LAUNCHER --start dart-business-docs$ARGS"
          RUN_ID="$(head -n1 /tmp/qn_out | tr -d '[:space:]')"
          [ -n "$RUN_ID" ] || { echo "❌ run id를 받지 못했습니다" >&2; exit 1; }
          echo "▶ 원격 실행 시작 (run: $RUN_ID) — SSH 세션과 분리되어 돌아갑니다"

          OFFSET=0
          while true; do
            qn_ssh "진행 조회" "$LAUNCHER --poll '$RUN_ID' $OFFSET"
            cat /tmp/qn_out
            STATE_LINE="$(grep '^QN_STATE ' /tmp/qn_err | tail -n1)"
            if [ -z "$STATE_LINE" ]; then
              echo "❌ 상태 줄(QN_STATE)을 받지 못했습니다" >&2
              cat /tmp/qn_err >&2
              exit 1
            fi
            # QN_STATE <다음offset> <running|done|missing> <exit코드>
            set -- $STATE_LINE
            OFFSET="$2"; STATE="$3"; CODE="$4"
            case "$STATE" in
              done)
                if [ "$CODE" = "0" ]; then
                  echo "✅ 원격 작업 완료"
                else
                  echo "❌ 원격 작업 실패 (exit=$CODE)" >&2
                fi
                exit "$CODE"
                ;;
              missing)
                echo "❌ 실행 로그를 찾을 수 없습니다 ($RUN_ID) — 서버에서 프로세스가 뜨지 못했을 수 있습니다" >&2
                exit 1
                ;;
            esac
            sleep 30
          done
